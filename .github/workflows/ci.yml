# Build, lint and test on every push and pull request.
#
# Each concern is its own job so a failure names itself in the checks list, and
# so they run in parallel. Everything here is exactly what `make` does locally —
# same targets, same scripts, same thresholds — so a clean local run means a
# clean CI run. The tools each script would otherwise skip are installed first,
# because a scanner that is not installed reports "skipped" and passes, and a
# job that passes by doing nothing is worse than no job.

name: CI

on:
  # Every branch, not just main: work that has been pushed but not yet opened
  # as a pull request is exactly the work most likely to be broken, and it used
  # to run nothing at all. 'branches' rather than a bare 'push:' so that a tag
  # push does not duplicate this — the release workflow waits on the runs from
  # the commit the tag names, which already exist by then.
  push:
    branches: ['**']
  # Kept for pull requests that arrive from a FORK, where the push above
  # happens in somebody else's repository and never reaches this one. Jobs are
  # guarded so a PR from a branch of this repo does not run everything twice.
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only: nothing here needs write access to the repository.
permissions:
  contents: read

jobs:
  # ==========================================================================
  lint:
    name: Lint
    # See the 'on:' block: skip for pull requests raised from a branch of
    # this repository, whose push event already ran this job.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # scripts/lint.sh skips any tool it cannot find, so they all go in.
      - name: Install the analyzers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential cppcheck clang-tidy shellcheck devscripts

      # The manpage and the version check both need the binary, and `make lint`
      # says so rather than guessing — but building here makes the failure, if
      # there is one, say "build" rather than "lint".
      - name: make build
        run: make build

      - name: make lint
        run: make lint

      # The manpage is generated from the program's own --help. A pull request
      # that adds an option and forgets to run `make man` fails here rather
      # than shipping a manpage that documents the previous release.
      - name: The manpage is current
        run: make man-check

  # ==========================================================================
  test:
    name: Tests (${{ matrix.cc }})
    # See the 'on:' block: skip for pull requests raised from a branch of
    # this repository, whose push event already ran this job.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      # One compiler failing must not cancel the other: knowing it breaks under
      # clang *and* passes under gcc is the whole point of running both.
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v7

      - name: Install the compiler and the archive tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential ${{ matrix.cc }} libarchive-tools
          # libarchive-tools is bsdtar. Without it the end-to-end suite skips
          # every BSD-writer test, which are half the reason it exists.

      - name: make build
        run: make build

      # -Werror is off by default so that a newer compiler inventing a new
      # warning cannot stop somebody building from source. Here is where a new
      # warning should fail, so here it is switched on.
      - name: Build again with -Werror
        run: make clean && make build WERROR=-Werror

      - name: make test-unit
        run: make test-unit

      - name: make test-cli
        run: make test-cli

  # ==========================================================================
  # The same tests on a different architecture.
  #
  # Everything else here runs on x86-64, where three things are true that are
  # not true everywhere: the machine is little-endian, `time_t` is 64 bits, and
  # plain `char` is signed. tmd is written not to care -- every header field is
  # decoded byte by byte, so there is not a single multi-byte load in the
  # program -- but nothing proved it, and "endian-clean by construction" is a
  # claim a test should be making rather than a comment.
  #
  # aarch64 is the cheap half of that. GitHub's arm runners are native, so this
  # costs no more than the x86 legs, and it moves two of the three: `char` is
  # unsigned there, and the ABI is different. It is still little-endian, so a
  # genuine byte-order bug would survive it -- the qemu-based big-endian leg
  # that would catch one is a separate, slower job and not this.
  arm:
    name: Tests (aarch64)
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Install the compiler and the archive tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential libarchive-tools

      - name: Confirm this really is aarch64
        # Cheap, and it fails loudly if the runner label ever silently falls
        # back to x86 -- at which point this job would be testing nothing while
        # continuing to report success.
        run: |
          arch="$(uname -m)"
          echo "running on $arch"
          test "$arch" = "aarch64"

      - name: make build
        run: make build

      - name: Build again with -Werror
        run: make clean && make build WERROR=-Werror

      - name: make test-unit
        run: make test-unit

      - name: make test-cli
        run: make test-cli

  # ==========================================================================
  # macOS, on a native runner.
  #
  # The first non-Linux system this builds on, and the cheapest way to find out
  # whether it can: no emulation, no VM, and it exercises both of the things
  # that were only ever assumed to work.
  #
  #   The linker flags. -Wl,-z,relro and friends are ELF concepts and Apple's
  #   linker rejects -z outright, so they are probed now rather than hardcoded.
  #
  #   The feature-test macros. _XOPEN_SOURCE=700 asks for strict POSIX, which on
  #   Darwin also switches off the namespace where getopt_long is declared --
  #   the one function here that POSIX does not define. -D_DARWIN_C_SOURCE keeps
  #   it visible.
  #
  # Neither could be checked without a Mac, so this job IS the check.
  #
  # Lint, coverage and the memory suite stay on Linux: the analyzers differ by
  # version, and one coverage gate arguing with itself per platform helps
  # nobody.
  macos:
    name: Tests (macOS)
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # GNU tar builds the fixtures: --format=gnu and --no-recursion are GNU
      # spellings, and the system tar here is bsdtar. It arrives as `gtar`,
      # which the suite looks for. bsdtar itself needs no installing -- it IS
      # the system tar, so the BSD-writer tests run natively rather than being
      # skipped as they are on a Linux box without libarchive-tools.
      - name: Install GNU tar and the decompressors
        run: brew install gnu-tar xz zstd

      - name: Say what this actually is
        # Printed rather than assumed: if a runner image ever changes its
        # compiler or its bash, this is the line that explains the next failure.
        run: |
          uname -srm
          cc --version | head -1
          make --version | head -1
          bash --version | head -1
          gtar --version | head -1
          tar --version | head -1

      - name: make build
        run: make build

      - name: Build again with -Werror
        run: make clean && make build WERROR=-Werror

      - name: make test-unit
        run: make test-unit

      - name: make test-cli
        run: make test-cli

      # The from-source install, staged so it needs no privileges. stat is
      # spelled -f here, not -c; that difference is the whole reason this job
      # cannot just reuse the Linux one.
      - name: make install, staged
        run: |
          make install DESTDIR="$PWD/staged" prefix=/usr/local
          test -x staged/usr/local/bin/tmd
          test -f staged/usr/local/share/man/man1/tmd.1
          test "$(stat -f '%Lp' staged/usr/local/bin/tmd)" = 755
          test "$(stat -f '%Lp' staged/usr/local/share/man/man1/tmd.1)" = 644
          rm -rf staged

      # The binary the whole job exists to produce, doing its job: a real
      # archive, read through the decompressor tmd spawns, from a file and from
      # a pipe. The unit and CLI suites cover this already -- what they cannot
      # cover is whether spawning gzip works on a system whose gzip is not GNU's.
      - name: Read a real compressed archive
        run: |
          mkdir -p t/sub && echo hello > t/a.txt && ln -s a.txt t/link
          gtar -czf t.tar.gz t
          ./bin/tmd -f t.tar.gz
          ./bin/tmd -f t.tar.gz -i | grep -Eq 'compression +gzip'
          ./bin/tmd < t.tar.gz > /dev/null
          rm -rf t t.tar.gz

  # ==========================================================================
  # The three BSDs, each in a QEMU virtual machine.
  #
  # GitHub has no BSD runners, so these are vmactions VMs: the repository is
  # rsynced in and the build runs inside. That is a different cost from the
  # native macOS runner -- minutes of boot before a line is compiled -- and a
  # different kind of failure to read, so it was worth doing only once the
  # portability work was known to hold somewhere that is not Linux. macOS was
  # that somewhere.
  #
  # Two things are installed rather than worked around, deliberately:
  #
  #   gmake. The Makefile is GNU make -- ifeq, :=, $(shell), $(filter), thirty
  #   five constructs deep. Under BSD make it does not degrade, it fails on
  #   syntax. Rewriting it to be portable between two make dialects would cost
  #   more than it could ever return.
  #
  #   bash. Seventeen scripts here start with it. Converting them all to POSIX
  #   sh to avoid one package is not a trade worth making.
  #
  # Both are one `pkg_add` away on every one of these systems, and the README
  # says so in the from-source instructions.
  #
  # python3 is NOT installed on OpenBSD, where naming the package is its own
  # small adventure. The JSON checks it guards will report themselves as
  # skipped rather than vanishing -- which is the whole reason the suite
  # learned to say what it skipped.
  #
  # The actions are pinned by commit, not by tag: a tag is a moving target and
  # these run with the repository checked out inside them.
  freebsd:
    name: Tests (FreeBSD)
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build and test in a FreeBSD VM
        uses: vmactions/freebsd-vm@d1e65811565151536c0c894fff74f06351ed26e6 # v1.4.5
        with:
          release: "14.0"
          usesh: true
          prepare: |
            pkg install -y bash gmake gtar xz zstd python3
          run: |
            set -e
            uname -srm
            cc --version | head -1
            gmake --version | head -1
            gtar --version | head -1
            gmake build
            gmake clean && gmake build WERROR=-Werror
            gmake test-unit
            gmake test-cli
            gmake install DESTDIR="$PWD/staged" prefix=/usr/local
            test -x staged/usr/local/bin/tmd
            test -f staged/usr/local/share/man/man1/tmd.1

  openbsd:
    name: Tests (OpenBSD)
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The strictest of the three, and the only system where a tool this suite
      # uses is absent rather than spelled differently: OpenBSD's head(1) takes
      # a line count and has no -c, so the suite falls back to dd there.
      - name: Build and test in an OpenBSD VM
        uses: vmactions/openbsd-vm@18edb32f4e48dae5865d7b8b3a9587bc01218a20 # v1.4.4
        with:
          release: "7.9"
          usesh: true
          sync: rsync
          prepare: |
            pkg_add -I bash gmake gtar xz zstd
          run: |
            set -e
            uname -srm
            cc --version | head -1
            gmake --version | head -1
            gtar --version | head -1
            gmake build
            gmake clean && gmake build WERROR=-Werror
            gmake test-unit
            gmake test-cli
            gmake install DESTDIR="$PWD/staged" prefix=/usr/local
            test -x staged/usr/local/bin/tmd
            test -f staged/usr/local/share/man/man1/tmd.1

  netbsd:
    name: Tests (NetBSD)
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build and test in a NetBSD VM
        uses: vmactions/netbsd-vm@eb3ba840926911ccf17dc9de235335cb27a02ba0 # v1.3.8
        with:
          release: "10.0"
          usesh: true
          # PKG_PATH spelled out because NetBSD's pkg_add has no default one,
          # and x86_64 rather than amd64: the amd64 URL only resolves through a
          # redirect that pkg_add does not follow reliably.
          prepare: |
            export PKG_PATH="https://cdn.NetBSD.org/pub/pkgsrc/packages/NetBSD/x86_64/10.0/All"
            pkg_add -v bash gmake gtar xz zstd
          run: |
            set -e
            uname -srm
            cc --version | head -1
            gmake --version | head -1
            gtar --version | head -1
            gmake build
            gmake clean && gmake build WERROR=-Werror
            gmake test-unit
            gmake test-cli
            gmake install DESTDIR="$PWD/staged" prefix=/usr/local
            test -x staged/usr/local/bin/tmd
            test -f staged/usr/local/share/man/man1/tmd.1

  # ==========================================================================
  # Separate from `test` because it is slow and because its failures are of a
  # different kind: not "the answer is wrong" but "the program did something it
  # is not allowed to do".
  memory:
    name: Sanitizers and valgrind
    # See the 'on:' block: skip for pull requests raised from a branch of
    # this repository, whose push event already ran this job.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install valgrind and the archive tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential valgrind libarchive-tools

      - name: make test-memory
        run: make test-memory

      - name: Upload the sanitizer logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sanitizer-logs
          path: .sanitize/*.log
          retention-days: 14
          if-no-files-found: ignore

  # ==========================================================================
  coverage:
    name: Coverage (80% gate)
    # See the 'on:' block: skip for pull requests raised from a branch of
    # this repository, whose push event already ran this job.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install gcovr and the archive tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential gcovr libarchive-tools

      # Runs both suites against one instrumented build: the unit tests never
      # reach main.c or opts.c, and the end-to-end tests are what cover them.
      - name: make coverage
        run: make coverage

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            .coverage/coverage.xml
            .coverage/*.gcov
            .coverage/index.html
          retention-days: 14
          if-no-files-found: ignore

  # ==========================================================================
  # The package has to build and the binary in it has to work. A release is not
  # the place to find out that debian/rules is broken: by then the tag exists.
  package:
    name: Package
    # See the 'on:' block: skip for pull requests raised from a branch of
    # this repository, whose push event already ran this job.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential debhelper devscripts lintian fakeroot

      # The from-source install path, which the README documents and which
      # nothing else here would notice breaking. Staged into a directory rather
      # than run for real: DESTDIR needs no privileges, so this checks the
      # layout and the modes without a sudo in CI.
      - name: make install, staged
        run: |
          make install DESTDIR="$PWD/staged" prefix=/usr
          test -x staged/usr/bin/tmd
          test -f staged/usr/share/man/man1/tmd.1
          # The modes matter: a manpage nobody can read is not installed.
          test "$(stat -c '%a' staged/usr/bin/tmd)" = 755
          test "$(stat -c '%a' staged/usr/share/man/man1/tmd.1)" = 644
          # And the default prefix is /usr/local, so a real install never lands
          # on top of what dpkg owns.
          make install DESTDIR="$PWD/staged-default" > /dev/null
          test -x staged-default/usr/local/bin/tmd
          rm -rf staged staged-default

      - name: make deb
        run: make deb

      # lintian's opinion is informational for a local build and a failure
      # here: a tag that a distribution would reject should not reach one.
      - name: lintian
        run: lintian --fail-on error,warning ../tmd_*.deb

      - name: Install it and check it runs
        run: |
          set -eux
          sudo dpkg -i ../tmd_*_amd64.deb
          # Everything the package installed. Printed on every run: it is two
          # lines of log and it is the answer to "where did the manpage
          # actually go", which a release job once failed for want of.
          dpkg -L tmd
          # The installed binary, not the one in ./bin.
          which tmd
          tmd --version
          man -w tmd
          # A real archive through the installed copy, and the exit status has
          # to be the documented one.
          tar -cf /tmp/check.tar debian src
          tmd -f /tmp/check.tar | head -5
          tmd -f /tmp/check.tar -i
          tmd -f /tmp/check.tar -c
          test "$(tmd -f /tmp/check.tar --format=json | head -c 1)" = "{"
          sudo dpkg -r tmd

      # dpkg-buildpackage writes one level above the checkout, and
      # upload-artifact refuses any path containing "..". Staged inside the
      # workspace first -- the release workflow already does this; only CI had
      # the bare ../ path, and nothing local exercises an artifact upload, so
      # it could not fail anywhere but here.
      - name: Stage the package for upload
        run: |
          mkdir -p artifacts
          cp ../tmd_*.deb artifacts/

      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
